# 로컬 개발용 인프라. ./gradlew bootRun 시 Spring Boot 가 자동으로 기동한다.
# 이미지 버전은 src/test/.../support/TestcontainersConfiguration.java 와 같게 유지한다.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: collab_canvas
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
    ports:
      - "5432"
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: collab_canvas
    ports:
      - "27017"
  redis:
    image: redis:7-alpine
    ports:
      - "6379"
